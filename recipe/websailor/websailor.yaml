# WebSailor-style SearchAgent config.
#
# This keeps the project's SearchAgent runtime, but aligns the LLM call kwargs and
# prompt layout with Alibaba DeepResearch WebSailor more closely.

defaults:
  - agent@agent: SearchAgent
  - llm@agent.llm_client: OpenAIClient
  - common@retry_policy: RetryPolicy
  - common@dataloader: GenericDataLoader
  - _self_

retry_policy:
  max_tries: 3

agent:
  llm_client:
    type: openai
    model: WebSailor-7B
    default_kwargs:
      temperature: 0.6
      top_p: 0.95
      stop:
        - "\n<tool_response>"
        - "<tool_response>"
    openai:
      api_key: "EMPTY"
      base_url: http://127.0.0.1:6001/v1
      concurrency_limit: 512
      extra_client_kwargs: null
  parser:
    type: websailor
    target: pkg://searchagent.llm.parsers.websailor:WebSailorParser
  sources:
    - type: elasticsearch
      name: bcp
      hosts: http://127.0.0.1:9200
      index: browsecomp_hybrid
      search_fields:
        - title^2
        - text
      document_id_field: url
      fetch_field: url
      highlight_fragment_size: 128
      snippet_chars: 512
      metadata_fields:
        - links
  tools:
    - type: search
      name: search
      source:
        - bcp
      response_char_limit: null
    - type: visit
      name: visit
      source:
        - bcp
      response_char_limit: null
  system_prompt: |
    You are a Web Information Seeking Master. Your task is to thoroughly seek the internet for information and provide accurate answers to questions. No matter how complex the query, you will not give up until you find the corresponding information.

    As you proceed, adhere to the following principles:

    1. **Persistent Actions for Answers**: You will engage in many interactions, delving deeply into the topic to explore all possible aspects until a satisfactory answer is found.

    2. **Repeated Verification**: Before presenting a Final Answer, you will **cross-check** and **validate the information** you've gathered to confirm its accuracy and reliability.

    3. **Attention to Detail**: You will carefully analyze each information source to ensure that all data is current, relevant, and from credible origins.
  query_prompt: null
  max_turn: 100
  max_turn_prompt: |
    You have now reached the maximum tool call turns you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:
    <think>your final thinking</think>
    <answer>your answer</answer>
  max_tokens: 32768
  max_tokens_prompt: |
    You have now reached the maximum context length you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:
    <think>your final thinking</think>
    <answer>your answer</answer>
  max_tokens_prompt_margin: 3072
  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.llm.parsers:ParsingError
    giveup: null
    jitter: pkg://backoff:full_jitter
    factor: 1.0
    base: 2.0
  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.errors:RecoverableError
    giveup: null
    jitter: pkg://backoff:full_jitter
    factor: 1.0
    base: 2.0

dataloader:
  source: data/browsecomp_plus_decrypted_qa.jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 32
output_path: outputs/WebSailor
overwrite_output: false

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
