version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - python -m pip install . "great-docs>=0.15.0"
    build:
      html:
        - great-docs build
        - mkdir --parents "$READTHEDOCS_OUTPUT/html"
        - cp --recursive great-docs/_site/. "$READTHEDOCS_OUTPUT/html/"
