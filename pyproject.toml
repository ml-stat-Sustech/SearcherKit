[project]
name = "searcherkit"
version = "0.1.0"
description = "Pluggable search agent runtime for multiple sources and LLM providers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "anthropic>=0.84.0",
    "backoff>=2.2.1",
    "datasets>=4.8.4",
    "elasticsearch<9.0.0",
    "fastmcp>=3.0.0",
    "hydra-core>=1.3.2",
    "json-repair>=0.54.2",
    "jsonschema>=4.26.0",
    "openai>=2.24.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.0.0",
    "tqdm>=4.67.1",
    "uvloop>=0.22.1; sys_platform != 'win32'",
]

[project.scripts]
searcher = "searcherkit.cli.main:main"

[project.optional-dependencies]
indexing = [
    "accelerate>=1.13.0",
    "elasticsearch<9.0.0",
    "mwparserfromhell>=0.6",
    "sentence-transformers>=2.0.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "great-docs>=0.15.0",
    "pytest>=9.0.2",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"
