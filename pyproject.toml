[project]
name = "webagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backoff>=2.2.1",
    "datasets>=4.8.4",
    "fastmcp>=3.0.0",
    "hydra-core>=1.3.2",
    "jsonschema>=4.26.0",
    "openai>=2.24.0",
    "pydantic>=2.0.0",
    "tqdm>=4.67.1",
    "uvloop>=0.22.1",
]

[project.scripts]
webagent = "webagent.__main__:main"

[project.optional-dependencies]
vllm = [
    "ray>=2.9.0",
    "vllm>=0.6.0",
]
elasticsearch = [
    "accelerate>=1.13.0",
    "elasticsearch<9.0.0",
    "mwparserfromhell>=0.6",
    "sentence-transformers>=2.0.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"
