[project]
name = "searchagent"
version = "0.1.0"
description = "Pluggable search agent runtime for offline web sources and multiple LLM providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "backoff>=2.2.1",
    "datasets>=4.8.4",
    "fastmcp>=3.0.0",
    "hydra-core>=1.3.2",
    "json-repair>=0.54.2",
    "jsonschema>=4.26.0",
    "openai>=2.24.0",
    "pydantic>=2.0.0",
    "tqdm>=4.67.1",
    "uvloop>=0.22.1; sys_platform != 'win32'",
]

[project.scripts]
searchagent = "searchagent.cli.main:main"

[project.optional-dependencies]
vllm = [
    "ray>=2.9.0",
    "vllm>=0.6.0",
]
elasticsearch-source = [
    "elasticsearch<9.0.0",
]
faiss = [
    "faiss-cpu>=1.8.0",
]
chroma = [
    "chromadb>=0.5.0",
]
ollama = [
    "ollama>=0.4.0",
]
anthropic = [
    "anthropic>=0.84.0",
]
indexing = [
    "accelerate>=1.13.0",
    "elasticsearch<9.0.0",
    "mwparserfromhell>=0.6",
    "sentence-transformers>=2.0.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"
