generate:
  dataset_path: ${oc.env:BCP_DATASET,/home/jovyan/data/searchagent/browsecomp_plus_decrypted_qa.jsonl}
  out_dir: ${oc.env:OUTPUT_DIR,outputs/sft/openseeker_bcp_strict}
  normalized_dataset: ${oc.env:NORMALIZED_DATASET,null}
  max_tokens: ${oc.env:MAX_TOKENS,32768}
  tool_count_max: ${oc.env:TOOL_COUNT_MAX,200}
  max_worker: ${oc.env:MAX_WORKER,60}
  pool_no_progress_timeout: ${oc.env:POOL_NO_PROGRESS_TIMEOUT,18000}
  pool_restart_rounds: ${oc.env:POOL_RESTART_ROUNDS,2}
  max_retry_rounds: ${oc.env:MAX_RETRY_ROUNDS,10}
  limit: ${oc.env:LIMIT,-1}
  print_stream: ${oc.env:PRINT_STREAM,false}
  sequential: ${oc.env:SEQUENTIAL,false}
  run_log_path: ${oc.env:RUN_LOG_PATH,null}
  no_run_log: ${oc.env:NO_RUN_LOG,false}

judge:
  run_after_generate: ${oc.env:RUN_JUDGE_AFTER_GENERATE,false}
  max_workers: ${oc.env:EVAL_MAX_WORKERS,20}
  limit: ${oc.env:EVAL_LIMIT,-1}
  top_k: ${oc.env:EVAL_TOP_K,-1}
  save_path: ${oc.env:EVAL_SAVE_PATH,null}
