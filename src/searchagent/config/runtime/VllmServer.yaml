# VllmServerConfig configuration
# Class: searchagent.runtime.vllm_engine.VllmServerConfig
# Note: vLLM exposes many more EngineArgs/FrontendArgs fields; add as needed.

target: pkg://searchagent.runtime.vllm_engine:VllmServerConfig
engine_args:
  target: pkg://vllm.engine.arg_utils:AsyncEngineArgs
  model: null
  tokenizer: null
  served_model_name: null
  trust_remote_code: false
  dtype: auto
  max_model_len: null
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  swap_space: 4.0
  enable_log_requests: false
frontend_args:
  target: pkg://vllm.entrypoints.openai.cli_args:FrontendArgs
  host: null
  port: 8000
  uvicorn_log_level: info
  disable_uvicorn_access_log: false
  allow_credentials: false
  allowed_origins:
    - "*"
  allowed_methods:
    - "*"
  allowed_headers:
    - "*"
uvicorn_args: null
env: null
startup_timeout_s: 60.0
