# ElasticsearchSource configuration
# Class: searchagent.sources.ElasticsearchSource
name: bcp
target: pkg://searchagent.sources:ElasticsearchSource
hosts: http://127.0.0.1:9200
index: browsecomp_hybrid
search_fields:
  - title^2
  - text
title_field: title
text_field: text
url_field: url
document_id_field: url
fetch_field: url
metadata_fields:
  - links
highlight: true
highlight_fragment_size: 128
snippet_chars: 512
request_timeout: null
client_kwargs: {}
