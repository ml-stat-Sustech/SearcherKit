agent:
  llm_client:
    type: openai
    model: /home/jovyan1/Qwen3-8B
    retry_policy: null
    default_kwargs:
      temperature: 1.0
      max_completion_tokens: 8192
      top_p: 1.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
  parser:
    type: upstream
  max_tokens: 40960
  system_prompt: |
    You are a helpful AI assistant that can search for information to answer questions accurately.

    When answering questions:
    1. Use the available tools to find relevant and reliable information
    2. Synthesize information from multiple sources when needed
    3. Provide accurate and comprehensive answers based on your search results
    4. Do not search the same query multiple times
    5. Make exactly one tool call at a time
    6. Always put your final answer in \boxed{} format

    Remember to search thoroughly and provide your final answer clearly within the \boxed{} format.
  query_prompt: "{query}"
  max_tokens_prompt_margin: 11000
  max_turn: 50
  run_timeout_seconds: 7200
  run_timeout_prompt_margin_seconds: 600
  max_turn_prompt: |
    You have now reached the maximum tool call turns you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:
    \boxed{your final answer, in a few words}
  max_tokens_prompt: |
    You have now reached the maximum context length you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:
    \boxed{your final answer, in a few words}
  run_timeout_prompt: |
    You are close to the maximum allowed running time. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:
    \boxed{your final answer, in a few words}
  raise_repeat_tool_call: false
  llm_retry_config: null
  tool_retry_config:
    max_tries: 3
    max_time: null
    exceptions:
      - pkg://searchagent.errors:RecoverableError
    giveup: null
    jitter: pkg://backoff:full_jitter
    factor: 1.0
    base: 1.0
  sources:
    - name: elasticsearch
      type: elasticsearch
      hosts: ["http://10.32.33.135:9200"]
      index: wiki20251101_qwen3-embedding-8b
      search_fields: ["title", "text"]
      es_max_concurrency: 512
      embedding_max_concurrency: 2048
      summary_max_concurrency: 1024
      title_field: title
      text_field: text
      url_field: url
      highlight: false
      snippet_chars: 8192
      vector_search_mode: vector
      embedding_prefix: |
        Instruct: Given a web search query, retrieve relevant passages that answer the query
        Query:
      embedding_model: /home/jovyan/Qwen3-Embedding-8B
      embedding_api_key: api_key
      embedding_base_url: http://10.32.33.135:8004/v1\
  tools:
    - type: search
      name: search
      description: Search for more information.
      inputSchema:
        type: object
        properties:
          query:
            type: string
        required:
          - query
        additionalProperties: false
      source: 
        - elasticsearch
      response_char_limit: null
      raise_argument_validation_error: false
      summary_goal_key: query
      summarizer:
        model: /home/jovyan/Qwen3-8B
        api_key: api_key
        max_chars: 80000
        base_url: http://10.32.33.135:6010/v1
        default_kwargs:
          max_tokens: 1024
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

