# WebExplorer-style SearchAgent config.
#
# This recipe keeps the project's default SearchAgent + WebExplorerParser runtime and
# aligns the model sampling settings with the official WebExplorer inference
# code. It uses SearchAgent's native source-backed `search` and `visit` tools.

defaults:
  - _self_

task_retry_policy:
  max_tries: 1

agent:
  llm_client:
    type: openai
    model: WebExplorer-8B
    default_kwargs:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 10000
    api_key: "EMPTY"
    base_url:
      - http://127.0.0.1:6002/v1
      - http://127.0.0.1:6003/v1
      - http://127.0.0.1:6004/v1
      - http://127.0.0.1:6005/v1
      - http://127.0.0.1:6006/v1
      - http://127.0.0.1:6007/v1
    concurrency_limit: 512
    extra_client_kwargs: null
  parser:
    type: upstream
  sources:
    - name: elasticsearch
      type: elasticsearch
      hosts: ["http://10.32.33.124:9200"]
      index: browsecomp_plus_qwen3-embedding-8b
      search_fields: ["title", "text"]
      es_max_concurrency: 1024
      embedding_max_concurrency: 2048
      title_field: title
      text_field: text
      url_field: url
      fetch_field: url
      highlight: true
      highlight_number_of_fragments: 5
      snippet_chars: 8192
      vector_search_mode: hybrid
      embedding_prefix: |
        Instruct: Given a web search query, retrieve relevant passages that answer the query
        Query:
      embedding_model: /home/jovyan/Qwen3-Embedding-8B
      embedding_api_key: api_key
      embedding_base_url: http://127.0.0.1:8004
  tools:
    - type: search
      name: search
      description: "Web search tool that performs batched web searches: supply an array 'queries'; the tool retrieves search results for each query."
      inputSchema:
        type: object
        properties:
          queries:
            type: array
            items:
              type: string
            description: "Array of query strings. The queries will be sent to search engine. You will get the brief search results with (title, url, snippet)s for each query."
        required:
          - queries
      source:
        - elasticsearch
      raise_argument_validation_error: false
      argument_mapping:
        queries: query
    - type: visit
      name: browse
      description: "Browse a webpage and extract relevant information based on a specific query."
      source:
        - elasticsearch
      inputSchema:
        type: object
        properties:
          url:
            type: 
              - string
            description: "The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs."
          query:
            type: string
            description: "The specific query to extract relevant information from the webpage."
        required:
          - url
          - query
      argument_mapping:
        url: document_id
        query: goal
      summary_goal_key: goal
      summarizer:
        model: /home/jovyan/Qwen3-8B-AWQ
        api_key: api_key
        max_chars: 40000
        base_url: http://127.0.0.1:6010/v1
        max_concurrency: 1024
        default_kwargs:
          max_tokens: 1024
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        retry_config: 
          max_tries: 3
  system_prompt: |
    You are a helpful assistant.
  query_prompt: "{query}"
  max_turn: 100
  max_turn_prompt: |
    --- Final Step Reached ---
    Now you reach the final step. 
    You are forbidden to call any tools.
    You must offer your final answer now.
  max_tokens: 110592
  max_tokens_prompt: |
    --- Maximum Length Limit Reached ---
    You have reached the maximum length limit. 
    The response is truncated.
    --- Final Step Reached ---
    Now you reach the final step. 
    You are forbidden to call any tools.
    You must offer your final answer now.
  max_tokens_prompt_margin: 3072
  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.llm.parsers:ParsingError
  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.common.errors:RecoverableError
    giveup: null

dataloader:
  source: /home/jovyan1/browsecomp_plus_decrypted_qa.jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 256
output_path: outputs/WebExplorer_bcp

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
