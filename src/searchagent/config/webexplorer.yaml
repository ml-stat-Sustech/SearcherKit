# WebExplorer-style SearchAgent config.
#
# This recipe keeps the project's default SearchAgent + WebExplorerParser runtime and
# aligns the model sampling settings with the official WebExplorer inference
# code. It uses SearchAgent's native source-backed `search` and `visit` tools.

defaults:
  - _self_

task_retry_policy:
  max_tries: 3

agent:
  llm_client:
    type: openai
    model: WebExplorer-8B
    default_kwargs:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 320000
    openai:
      api_key: "EMPTY"
      base_url: 
        - http://127.0.0.1:8001/v1
      concurrency_limit: 512
      extra_client_kwargs: null
  parser:
    type: upstream
  sources:
    - name: elasticsearch
      type: elasticsearch
      hosts: ["http://10.32.33.124:9200"]
      index: browsecomp_plus_qwen3-embedding-8b
      search_fields: ["title", "text"]
      es_max_concurrency: 1024
      embedding_max_concurrency: 2048
      title_field: title
      text_field: text
      url_field: url
      fetch_field: url
      highlight: true
      highlight_number_of_fragments: 5
      snippet_chars: 8192
      vector_search_mode: hybrid
      embedding_prefix: |
        Instruct: Given a web search query, retrieve relevant passages that answer the query
        Query:
      embedding_model: /home/jovyan/Qwen3-Embedding-8B
      embedding_api_key: api_key
      embedding_base_url: http://127.0.0.1:8004
  tools:
    - type: search
      name: search
      description: "Performs batched web searches: supply an array 'query'; the tool retrieves the top 10 results for each query in one call."
      inputSchema:
        type: object
        properties:
          query:
            type: array
            items:
              type: string
            description: "Array of query strings. Include multiple complementary search queries in a single call."
        required:
          - query
      source:
        - elasticsearch
      raise_argument_validation_error: false
    - type: visit
      name: visit
      description: "Visit webpage(s) and return the summary of the content."
      source:
        - elasticsearch
      inputSchema:
        type: object
        properties:
          url:
            type: 
              - string
              - array
            items: 
              type: string
            minItems: 1
            description: "The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs."
          goal:
            type: string
            description: "The goal of the visit for webpage(s)."
        required:
          - url
          - goal
      argument_mapping:
        url: document_id
      summary_goal_key: goal
      summarizer:
        model: /home/jovyan/Qwen3-8B-AWQ
        api_key: api_key
        max_chars: 40000
        base_url: http://127.0.0.1:6010/v1
        max_concurrency: 1024
        default_kwargs:
          max_tokens: 1024
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        retry_config: 
          max_tries: 3
  system_prompt: |
    You are a helpful assistant.

    Solve the user's question by iteratively using the available tools. Search
    for promising sources first, then visit the most relevant URLs to answer
    specific sub-questions. Do not rely on unsupported prior knowledge when the
    tools can verify the answer.

    When you have enough evidence, provide the final answer inside
    <answer></answer> and stop calling tools.
  query_prompt: "{query}"
  max_turn: 100
  max_turn_prompt: |
    You have reached the final step. You are forbidden to call any tools.
    Based on all the information above, provide your final answer now in the format:
    <answer>your answer</answer>
  max_tokens: 110592
  max_tokens_prompt: |
    You have reached the maximum context length. You are forbidden to call any tools.
    Based on all the information above, provide your final answer now in the format:
    <answer>your answer</answer>
  max_tokens_prompt_margin: 3072
  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.llm.parsers:ParsingError
  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.common.errors:RecoverableError
    giveup: null

dataloader:
  source: data/browsecomp_plus_decrypted_qa.jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 16
output_path: outputs/WebExplorer
overwrite_output: false

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
