# @package _global_
# Ollama-backed TUI Active Model + Active Source smoke-test config.
# Ollama is accessed through its OpenAI-compatible endpoint, so the client type
# and the model command provider label are both `openai`.
#
# Prerequisites:
#   ollama pull qwen2.5:0.5b
#   ollama pull llama3.2:1b
#
# Run from the repository root without loading an existing .env override:
#   env -u LLM_PROVIDER -u LLM_MODEL -u LLM_API_KEY -u LLM_BASE_URL \
#     uv run --extra tui python -m searchagent tui --env-file "" \
#       --config-name examples/ollama_model_select_tui
#
# In the TUI, use slash completion to compare status-line effects:
#   /models:openai/qwen2.5:0.5b
#   /models:openai/llama3.2:1b
#   /sources:wiki(file)
#   /sources:bcp(file)

defaults:
  - _self_

agent:
  llm_client:
    type: openai
    model: qwen2.5:0.5b
    default_kwargs:
      temperature: 0.2
      max_tokens: 512
    openai:
      api_key: ollama
      base_url: http://127.0.0.1:11434/v1
      concurrency_limit: null
      extra_client_kwargs: null
  parser:
    type: qwen
    qwen:
      drop_thinking: true
  sources:
    # These roots are lightweight stand-ins for testing Active Source changes.
    - type: file
      name: wiki
      root_path: docs
    - type: file
      name: bcp
      root_path: tests/fixtures/files
  tools:
    - type: search
      name: search
      source:
        - wiki
    - type: visit
      name: visit
      source:
        - wiki
  system_prompt: |
    Use search to find relevant documents and visit to read selected documents.
    Put the final answer inside <answer></answer> tags.
  query_prompt: null
  max_turn: 6
  max_turn_prompt: null
  max_tokens: 2048
  max_tokens_prompt: null
  max_tokens_prompt_margin: 128
  llm_retry_config: null
  tool_retry_config: null

output_path: outputs/ollama_model_select_tui
