# @package _global_
# Native source-backed tool example using an in-memory corpus.
#
# Run from the repository root:
# python -m searchagent run --config-name examples/memory_native

defaults:
  - /agent@agent: SearchAgent
  - /llm@agent.llm_client: OpenAIClient
  - /llm@agent.parser: QwenParser
  - /common@retry_policy: RetryPolicy
  - /common@dataloader: GenericDataLoader
  - _self_

retry_policy:
  max_tries: 3

agent:
  llm_client:
    type: openai
    model: Qwen3-8B
    default_kwargs:
      temperature: 0.2
      max_tokens: 1024
      stop:
        - "<tool_response>"
        - "\n<tool_response>"
    openai:
      api_key: YOUR_API_KEY
      base_url: http://127.0.0.1:8001/v1
      concurrency_limit: 8
      extra_client_kwargs: null
  parser:
    type: qwen
    qwen:
      upstream_parsed: false
      drop_thinking: true
  sources:
    - type: memory
      name: memory
      documents:
        - id: native-tools
          title: Native source-backed tools
          text: SearchAgent exposes DataSource implementations through built-in search and visit tools.
        - id: elasticsearch-source
          title: Elasticsearch source
          text: ElasticsearchSource searches document indexes and visit fetches full documents by id.
  tools:
    - type: search
      name: search
      source: memory
      response_char_limit: null
    - type: visit
      name: visit
      source: memory
      response_char_limit: null
  system_prompt: |
    Use search to find relevant documents and visit to read a selected document.
    Put the final answer inside <answer></answer> tags.
  query_prompt: null
  max_turn: 6
  max_turn_prompt: |
    Stop calling tools and answer now in the format:
    <answer>your answer</answer>
  max_tokens: 4096
  max_tokens_prompt: |
    Stop calling tools and answer now in the format:
    <answer>your answer</answer>
  max_tokens_prompt_margin: 512
  llm_retry_config:
    max_tries: 3
    exceptions:
      - pkg://searchagent.llm.parsers:ParsingError
  tool_retry_config:
    max_tries: 3
    exceptions:
      - pkg://searchagent.errors:RecoverableError

dataloader:
  source: src/searchagent/config/examples/data/memory_questions.jsonl
  fmt: jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 2
output_path: outputs/examples/memory_native
overwrite_output: false

checkpoint:
  enabled: true
  dir: null
  resume: true
  filename: manifest.json

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
