# @package _global_
# Native source-backed tool example using BrowseComp Plus in Elasticsearch.
#
# First deploy the corpus, for example:
# python -m searchagent plugins deploy browsecomp-plus --dataset_path Tevatron/browsecomp-plus-corpus --es_host http://127.0.0.1:9200 --index_name browsecomp_hybrid
#
# Then run from the repository root:
# python -m searchagent run --config-path src/searchagent/config --config-name examples/browsecomp_elasticsearch

defaults:
  - /agent@agent: SearchAgent
  - /llm@agent.llm_client: OpenAIClient
  - /llm@agent.parser: QwenParser
  - /common@retry_policy: RetryPolicy
  - /common@dataloader: GenericDataLoader
  - _self_

retry_policy:
  max_tries: 3

agent:
  llm_client:
    type: openai
    model: Qwen3-8B
    default_kwargs:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 10000
      stop:
        - "<tool_response>"
        - "\n<tool_response>"
    openai:
      api_key: EMPTY
      base_url: http://127.0.0.1:8001/v1
      concurrency_limit: 512
      extra_client_kwargs: null
  parser:
    type: qwen
    qwen:
      upstream_parsed: false
      drop_thinking: false
  sources:
    - type: elasticsearch
      name: bcp
      hosts: http://127.0.0.1:9200
      index: browsecomp_hybrid
      search_fields:
        - title^2
        - text
      document_id_field: url
      fetch_field: url
      highlight_fragment_size: 128
      snippet_chars: 512
      metadata_fields:
        - links
  tools:
    - type: search
      name: search
      source:
        - bcp
      response_char_limit: null
    - type: visit
      name: visit
      source:
        - bcp
      response_char_limit: null
  system_prompt: |
    Solve the user's question by using search for candidate sources and visit for full documents.
    Put the final answer inside <answer></answer> tags.
  query_prompt: null
  max_turn: 100
  max_turn_prompt: |
    You have reached the final step. Do not call tools. Answer now in the format:
    <answer>your answer</answer>
  max_tokens: 110592
  max_tokens_prompt: |
    You have reached the maximum context length. Do not call tools. Answer now in the format:
    <answer>your answer</answer>
  max_tokens_prompt_margin: 3072
  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.llm.parsers:ParsingError
  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searchagent.errors:RecoverableError

dataloader:
  source: data/browsecomp_plus_decrypted_qa.jsonl
  fmt: jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 16
output_path: outputs/examples/browsecomp_elasticsearch
overwrite_output: false

checkpoint:
  enabled: true
  dir: null
  resume: true
  filename: manifest.json

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
