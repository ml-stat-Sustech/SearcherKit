# @package _global_
# TUI Active Source example using two repository-local file sources.
#
# Run from the repository root after installing the TUI extra:
# uv run --extra tui python -m searchagent tui --config-name examples/file_multi_source_tui
#
# In the TUI, type /sources and choose one of:
# /sources:wiki(file)
# /sources:bcp(file)

defaults:
  - _self_

agent:
  llm_client:
    type: openai
    model: Qwen3-8B
    default_kwargs:
      temperature: 0.2
      max_tokens: 1024
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:8001/v1
    concurrency_limit: 4
    extra_client_kwargs: null
  parser:
    type: qwen
    qwen:
      drop_thinking: true
  sources:
    # These roots are lightweight stand-ins for testing Active Source changes.
    - type: file
      name: wiki
      root_path: docs
    - type: file
      name: bcp
      root_path: tests/fixtures/files
  tools:
    - type: search
      name: search
      source:
        - wiki
    - type: visit
      name: visit
      source:
        - wiki
  system_prompt: |
    Use search to find relevant documents and visit to read selected documents.
    Put the final answer inside <answer></answer> tags.
  query_prompt: null
  max_turn: 6
  max_turn_prompt: |
    Stop calling tools and answer now in the format:
    <answer>your answer</answer>
  max_tokens: 4096
  max_tokens_prompt: |
    Stop calling tools and answer now in the format:
    <answer>your answer</answer>
  max_tokens_prompt_margin: 512
  llm_retry_config:
    max_tries: 1
  tool_retry_config:
    max_tries: 1

output_path: outputs/examples/file_multi_source_tui

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
