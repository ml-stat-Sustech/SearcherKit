# Native SearchTool configuration
# Class: searchagent.tools.search.SearchTool

type: search
name: search
description: Search the configured data source.
inputSchema:
  type: object
  properties:
    query_list:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 4
    top_k:
      type: integer
      minimum: 1
  required:
    - query_list
  additionalProperties: false
source: memory
source_config: null
response_char_limit: null
raise_argument_validation_error: false
