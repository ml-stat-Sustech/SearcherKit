# Full config example for a Qwen-backed SearcherKit agent

defaults:
  - _self_

task_retry_policy:
  max_tries: 3

agent:
  llm_client:
    type: openai
    model: /home/jovyan/Tongyi-DeepResearch-30B-A3B
    default_kwargs:
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 1.1
      stop:
        - "\n<tool_response>"
        - "<tool_response>"
    api_key: "a"
    base_url:
      - http://127.0.0.1:6002/v1
      - http://127.0.0.1:6003/v1
      - http://127.0.0.1:6004/v1
      - http://127.0.0.1:6005/v1
      - http://127.0.0.1:6006/v1
      - http://127.0.0.1:6007/v1
    concurrency_limit: 512
    extra_client_kwargs: null
  parser:
    type: tongyi_deep_research
  sources:
    - name: elasticsearch
      type: elasticsearch
      hosts: ["http://10.32.33.124:9200"]
      index: browsecomp_plus_qwen3-embedding-8b
      search_fields: ["title", "text"]
      es_max_concurrency: 1024
      embedding_max_concurrency: 2048
      title_field: title
      text_field: text
      url_field: url
      fetch_field: url
      highlight: true
      highlight_number_of_fragments: 5
      snippet_chars: 8192
      vector_search_mode: hybrid
      embedding_prefix: |
        Instruct: Given a web search query, retrieve relevant passages that answer the query
        Query:
      embedding_model: /home/jovyan/Qwen3-Embedding-8B
      embedding_api_key: api_key
      embedding_base_url: http://127.0.0.1:8004
  tools:
    - type: search
      name: search
      description: "Performs batched web searches: supply an array 'query'; the tool retrieves the top 10 results for each query in one call."
      inputSchema:
        type: object
        properties:
          query:
            type: array
            items:
              type: string
            description: "Array of query strings. Include multiple complementary search queries in a single call."
        required:
          - query
      source:
        - elasticsearch
      raise_argument_validation_error: false
    - type: visit
      name: visit
      description: "Visit webpage(s) and return the summary of the content."
      source:
        - elasticsearch
      inputSchema:
        type: object
        properties:
          url:
            type: 
              - string
              - array
            items: 
              type: string
            minItems: 1
            description: "The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs."
          goal:
            type: string
            description: "The goal of the visit for webpage(s)."
        required:
          - url
          - goal
      argument_mapping:
        url: document_id
      summary_goal_key: goal
      summarizer:
        model: /home/jovyan/Qwen3-8B-AWQ
        api_key: api_key
        max_chars: 40000
        base_url: http://127.0.0.1:6010/v1
        max_concurrency: 1024
        default_kwargs:
          max_tokens: 1024
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        retry_config: 
          max_tries: 3

  system_prompt: You are a deep research assistant. Your core function is to conduct thorough, multi-source investigations into any topic. You must handle both broad, open-domain inquiries and queries within specialized academic fields. For every request, synthesize information from credible, diverse sources to deliver a comprehensive, accurate, and objective response. When you have gathered sufficient information and are ready to provide the definitive response, you must enclose the entire final answer within <answer></answer> tags.
  query_prompt: "{query}"
  max_turn: 2000
  max_turn_prompt: "You have now reached the maximum tool call turns you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:\n\\<answer></answer>"
  max_tokens: 131072
  max_tokens_prompt: "You have now reached the maximum context length you can handle. You should stop making tool calls and, based on all the information above, think again and provide what you consider the most likely answer in the following format:\n\\<answer></answer>"
  max_tokens_prompt_margin: 8192
  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searcherkit.llm.parsers:ParsingError
  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://searcherkit.common.errors:RecoverableError

dataloader:
  source: /home/jovyan1/browsecomp_plus_decrypted_qa.jsonl
  input_key: question
  answer_key: answer
  max_items: null

max_concurrency: 256
output_path: outputs/tongyi_deepresearch_bcp

checkpoint:
  enabled: true
  dir: null
  resume: true
  filename: manifest.json

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
