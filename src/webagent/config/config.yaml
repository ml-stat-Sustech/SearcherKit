retry_policy:
  max_tries: 3

# ===========================================================
# AGENT: LLM client, parser, tools & behavior
# ===========================================================
agent:
  llm_client:
    type: openai
    model: Qwen3-8B
    default_kwargs:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      extra_body:
        top_k: 20
      stop:
        - "<tool_response>"
        - "\n<tool_response>"
    openai:
      api_key: "${oc.env:OPENAI_API_KEY}"
      base_url: http://127.0.0.1:8001/v1
      concurrency_limit: 512

  parser:
    type: qwen
    qwen:
      upstream_parsed: false
      drop_thinking: true

  tools:
    - name: search
      endpoint: http://127.0.0.1:8300/mcp/
      max_concurrency: 512
      raise_on_fatal: true
    - name: visit
      endpoint: http://127.0.0.1:8300/mcp/
      max_concurrency: 256
      raise_on_fatal: true

  system_prompt: >-
    You are a deep research assistant. Your core function is to conduct
    thorough, multi-source investigations into any topic. You must handle both
    broad, open-domain inquiries and queries within specialized academic fields.
    For every request, synthesize information from credible, diverse sources to
    deliver a comprehensive, accurate, and objective response. When you have
    gathered sufficient information and are ready to provide the definitive
    response, you must enclose the entire final answer within
    <answer></answer> tags.

  max_turn: 100
  max_turn_prompt: >-
    You have now reached the maximum tool call turns you can handle. You should
    stop making tool calls and, based on all the information above, think again
    and provide what you consider the most likely answer in the following
    format:

    <answer>your answer</answer>

  max_tokens: 131072
  max_tokens_prompt: >-
    You have now reached the maximum context length you can handle. You should
    stop making tool calls and, based on all the information above, think again
    and provide what you consider the most likely answer in the following
    format:

    <answer>your answer</answer>

  max_tokens_prompt_margin: 3072

  llm_retry_config:
    max_tries: 5
    exceptions:
      - pkg://webagent.llm.parser:ParsingError
    giveup: null
    jitter: pkg://backoff.full_jitter
    factor: 1.0
    base: 2.0

  tool_retry_config:
    max_tries: 5
    exceptions:
      - pkg://webagent.tools:ToolRecoverableError
    giveup: null
    jitter: pkg://backoff.full_jitter
    factor: 1.0
    base: 2.0

# ===========================================================
# RUNTIME: concurrency, output & logging
# ===========================================================
max_concurrency: 16
output_path: outputs/agent_history

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"

# ===========================================================
# DATALOADER
# ===========================================================
dataloader:
  source: data/browsecomp_plus_decrypted_qa.jsonl
  input_key: question

# ===========================================================
# AUTO STARTUP: elasticsearch + MCP server
# ===========================================================
auto_startup:
  enabled: false
  elasticsearch:
    enabled: false
    host: ""
    index_name: null
    corpus_type: wiki
    wiki_dump_path: null
    bcp_dataset_path: Tevatron/browsecomp-plus-corpus
    include_vector: false
    embedding_dim: 1024
    model_name: Qwen3-Embedding-0.6B
    prompt_strategy: "none"
    cpu_batch_size: 200
    gpu_batch_size: 20
    startup_timeout_s: 60.0
    options: {}
    env: {}
  mcp_server:
    enabled: false
    host: 0.0.0.0
    port: 8100
    workers: 8
    startup_timeout_s: 30.0
    env: {}
