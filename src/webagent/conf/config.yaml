# Full config example for a Qwen-backed WebAgent

defaults:
  - agent@agent: WebAgent
  - llm@agent.llm_client: OpenAIClient
  - llm@agent.parser: QwenParser
  - utils@retry_policy: RetryPolicy
  - dataloader@dataloader: GenericDataLoader
  - _self_

retry_policy:
  max_tries: 3
  max_time: null
  exceptions:
    - pkg://builtins:Exception
  giveup: null
  jitter: pkg://backoff:full_jitter
  factor: 1.0
  base: 2.0

agent:
  llm_client:
    model: Qwen3-8B
    api_key: YOUR_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_kwargs:
      temperature: 0.2
      max_tokens: 1024
    concurrency_limit: 8
  tools: 
    - target: pkg://webagent.tools:MCPTool
      name: search
      endpoint: http://127.0.0.1:8100/mcp
      transport: http
      max_concurrency: 8
      enable_trace_logging: true
  system_prompt: ""
  max_turn: 10
  max_turn_prompt: null
  max_tokens: 1024
  max_tokens_prompt: null
  max_tokens_prompt_margin: 128
  llm_retry_policy:
    target: pkg://webagent.utils.retry:RetryPolicy
    max_tries: 3
    max_time: 30
    exceptions:
      - pkg://webagent.llm.parser:ParsingError
    giveup: null
    jitter: pkg://backoff:full_jitter
    factor: 1.0
    base: 2.0
  tool_retry_policy:
    target: pkg://webagent.utils.retry:RetryPolicy
    max_tries: 3
    max_time: 30
    exceptions:
      - pkg://webagent.tools:ToolRecoverableError
    giveup: null
    jitter: pkg://backoff:full_jitter
    factor: 1.0
    base: 2.0

dataloader:
  source: /path/to/data.jsonl

auto_startup:
  enabled: false
  elasticsearch:
    enabled: false
    corpus_type: wiki  # wiki | bcp
    host: "http://192.168.77.12:9200"
    index_name: "wiki20251001_qwen3-embedding-0.6b"
    include_vector: true
    embedding_dim: 1024
    model_name: "Qwen3-Embedding-0.6B"
    prompt_strategy: "none"
    wiki_dump_path: null
    bcp_dataset_path: "Tevatron/browsecomp-plus-corpus"
    cpu_batch_size: 200
    gpu_batch_size: 20
    startup_timeout_s: 60.0
    options: {}
    env: {}
  mcp_server:
    enabled: false
    host: "0.0.0.0"
    port: 8100
    workers: 8
    env:
      VLLM_MODEL: "/mnt/sharedata/ssd_large/common/LLMs/Qwen3-Embedding-0.6B"
      VLLM_ENDPOINT: "http://192.168.77.15:8200/v1"
      SUMMARY_MODEL: "/mnt/sharedata/ssd_large/common/LLMs/Qwen3-8B-FP8"
      SUMMARY_BASE_URL: "http://192.168.77.17:8300/v1"
      SUMMARY_API_KEY: "EMPTY"
    startup_timeout_s: 30.0

output_path: outputs/agent_history
overwrite_output: false

logging:
  global_file: ${output_path}/run.log
  trace:
    enabled: true
    dir: ${output_path}/traces
    format: text
    level: DEBUG
    filename_template: "{sample_id}_{trace_id}.log"
