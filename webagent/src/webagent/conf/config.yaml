# Full config example for a Qwen-backed WebAgent

defaults:
  - llm@llm_client: OpenAIClient
  - llm@parser: QwenParser
  - utils@retry_policy: RetryPolicy
  - agent@agent: WebAgent
  - data_source@data_source: GenericDataSource
  - _self_

llm_client:
  model: Qwen3-8B
  api_key: YOUR_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_kwargs:
    temperature: 0.2
    max_tokens: 1024
  concurrency_limit: 8

retry_policy:
  max_tries: 3
  max_time: null
  exceptions:
    - builtins.Exception
  giveup: null
  jitter: backoff.full_jitter
  factor: 1.0
  base: 2.0

agent:
  llm_client: ${llm_client}
  parser: ${parser}
  tools: 
    - target: webagent.tools.tool.GenericMCPTool
      mcp_tool_name: search
      endpoint: http://127.0.0.1:8100/mcp
      auth_header: ""
      transport: http
      max_concurrency: 8
      response_char_limit: 20000
      enable_trace_logging: true
      raise_on_fatal: true
      final_answer_generator: null
  system_prompt: ""
  max_turn: 10
  max_turn_prompt: null
  max_tokens: 1024
  max_tokens_prompt: null
  max_tokens_prompt_margin: 128
  llm_retry_policy:
    target: webagent.utils.retry.RetryPolicy
    max_tries: 3
    max_time: 30
    exceptions:
      - webagent.llm.parser.ParsingError
    giveup: null
    jitter: backoff.full_jitter
    factor: 1.0
    base: 2.0
  tool_retry_policy:
    target: webagent.utils.retry.RetryPolicy
    max_tries: 3
    max_time: 30
    exceptions:
      - builtins.Exception
    giveup: null
    jitter: backoff.full_jitter
    factor: 1.0
    base: 2.0

data_source:
  source: /path/to/data.jsonl

output_path: outputs/agent_history