# Full config example for a Qwen-backed WebAgent

defaults:
  - llm@llm_client: OpenAIClient
  - llm@parser: QwenParser
  - utils@retry_policy: RetryPolicy
  - agent@agent: WebAgent
  - _self_

llm_client:
  model: Qwen3-8B
  api_key: YOUR_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_kwargs:
    temperature: 0.2
    max_tokens: 1024
  concurrency_limit: 8

utils:
  retry_policy:
    max_tries: 3
    max_time: null
    exceptions:
      - builtins.Exception
    giveup: null
    jitter: backoff.full_jitter
    factor: 1.0
    base: 2.0

agent:
  llm_client: ${llm_client}
  parser: ${parser}
  tools: []
  system_prompt: ""
  max_turn: 10
  max_turn_prompt: null
  max_tokens: 1024
  max_tokens_prompt: null
  max_tokens_prompt_margin: 128
