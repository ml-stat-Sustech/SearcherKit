[project]
name = "webagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backoff>=2.2.1",
    "fastmcp>=3.0.0",
    "hydra-core>=1.3.2",
    "openai>=2.24.0",
    "uvloop>=0.22.1",
]

[project.scripts]
webagent = "webagent.__main__:main"

[project.optional-dependencies]
vllm = [
    "ray>=2.9.0",
    "vllm>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
