# from math/gsm8k dapo dynamic_bs.yaml and agent_workflow/config.yaml

experiment_name: webagent
trial_name: trial0

seed: 1
dynamic_bs: false
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 2
  n_gpus_per_node: 8
  fileroot: /home/jovyan1/AReaL/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /home/jovyan1/AReaL/name_resolve

scheduler:
  type: ray

workflow:
  training: true
  agent:
    model: ${actor.path}
    max_tokens: 65536
    # system_prompt: "You are a helpfule assistant, answer the question with tools.\n\nWhile calling the tools, avoid making identical tool calls that had been called before.\nAvoid making more than 5 tool calls in a single response, but always make more tool calls in the next turn if more information is needed.\n\nYour final answer should be in the following format:\n<answer>{{your succinct, final answer, in a few words}}</answer>\n\n"
    # system_prompt: "You are a information seeking master. Seek information using the tools provided to answer the question.\n\nWhile calling the tools, abey the following rules:\n\n1. Think carefully about next tool call. Query different keywords for more information.\n2. Be parsistant in making different queries to gather as enough information as possible to answer the question.\n3. Always try to make tool calls to verify your assumptions before moving on and before answering.\n\nYour final answer should be in the following format:\n<answer>{{your succinct, final answer, in a few words}}</answer>"
    question_prompt: |
      You are a deep research agent. You need to answer the given question by interacting with a search engine, using the search tool provided. Please perform brief reasoning and use the tool step by step, in an interleaved manner. You may call search multiple rounds
      For example:
      <think> your think </think>
      <tool_call> 1 tool call per round </tool_call>
      <tool_response> response from tool </tool_response>
      <think> another round of think </think>
      <tool_call> another round of tool calls</tool_call>
      <tool_response> response from tool </tool_response>
      ...

      <question>{Question}<\question>

      Your response should be in the following format:
      <think>{{your final thought on what should be the final answer}}</think>
      <answer>{{your succinct, final answer, in a few words}}</answer>
    max_tokens_prompt_margin: 11000
    max_turn: 1000
    raise_repeat_tool_call: true
    generation: 
      n_samples: 8
      min_new_tokens: 0
      max_new_tokens: 9000
      # max_tokens: 131072
      greedy: false
      temperature: 1.0
      top_p: 1.0
      # top_k: 20

eval_workflow:
  training: false
  agent:
    model: ${actor.path}
    max_tokens: ${workflow.agent.max_tokens}
    system_prompt: ${workflow.agent.system_prompt}
    question_prompt: ${workflow.agent.question_prompt}
    max_tokens_prompt_margin: 11000
    max_turn: 1000
    raise_repeat_tool_call: false
    generation: 
      n_samples: 1
      min_new_tokens: 0
      max_new_tokens: 9000
      # max_tokens: 131072
      greedy: false
      temperature: 0.6
      top_p: 0.95
      # top_k: 20

rollout:
  experiment_name: ${experiment_name}
  backend: sglang:d8
  trial_name: ${trial_name}
  max_concurrent_rollouts: 128 # the concurrency refer to task, not traj
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  request_timeout: 7200
  openai:
    mode: inline
    tool_call_parser: qwen
    reasoning_parser: qwen3
    export_style: concat
    chat_template_type: concat 
    turn_discount: 1.0
    engine_max_tokens: ${workflow.agent.max_tokens}
    session_timeout_seconds: 7200

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: ${workflow.agent.generation.max_new_tokens}
  # max_tokens: 131072
  greedy: false
  temperature: ${workflow.agent.generation.temperature}
  top_p: ${workflow.agent.generation.top_p}
  top_k: ${workflow.agent.generation.top_k}

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: ${eval_workflow.agent.generation.max_new_tokens}
  # max_tokens: 131072
  greedy: false
  temperature: ${eval_workflow.agent.generation.temperature}
  top_p: ${eval_workflow.agent.generation.top_p}
  top_k: ${eval_workflow.agent.generation.top_k}

actor:
  # enable_tree_training: true
  # pad_to_maximum: true # Must be set to true for tree training
  weight_update_mode: xccl
  backend: fsdp:c4
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /home/jovyan1/Qwen3-8B
  attn_impl: "flash_attention_3"
  init_from_scratch: false
  disable_dropout: false
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    # max_tokens_per_mb: ${workflow.agent.max_tokens}
    max_tokens_per_mb: 70000
  optimizer:
    type: adam
    lr: 5e-6
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.6
  eps_clip_higher: 1.25
  temperature: ${gconfig.temperature}
  overlong_reward_penalty: false
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  behave_imp_weight_cap: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${workflow.agent.generation.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {WEBAGENT_LOG_LEVEL: "WARN", SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  backend: ${actor.backend}
  path: ${actor.path}
  attn_impl: "flash_attention_3"
  init_from_scratch: false
  dtype: ${actor.dtype}
  mb_spec:
    # max_tokens_per_mb: ${workflow.agent.max_tokens}
    max_tokens_per_mb: 70000
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: ${workflow.agent.max_tokens}
  mem_fraction_static: 0.8
  max_prefill_tokens: ${workflow.agent.max_tokens}

# datasets
train_dataset:
  batch_size: 128
  shuffle: true
  pin_memory: true
  num_workers: 16
  path: /home/jovyan1/ASearcher_en_no-math_Qwen3-8B-reject-sample-clean/ASearcher_en_no-math_Qwen3-8B-reject-sample-clean.jsonl
  type: rl

valid_dataset:
  batch_size: 256
  pin_memory: true
  num_workers: 4
  path: /home/jovyan1/AReaL/browsecomp_plus_decrypted_qa.jsonl
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 16
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 16
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 16
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: ${experiment_name}
    name: ${trial_name}

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
